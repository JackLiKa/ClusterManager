name: Bug report
_description: Report a problem or unexpected behavior.
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide minimal steps to reproduce the behavior.
      placeholder: |
        1. Start the backend with `./mvnw spring-boot:run`
        2. Open `http://localhost:3000/`
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include logs or screenshots if applicable.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Java version, browser, and commit hash.
      placeholder: |
        - OS: Windows 11
        - Java: 21.0.9
        - Browser: Chrome 128
        - Commit: abc1234
    validations:
      required: false
