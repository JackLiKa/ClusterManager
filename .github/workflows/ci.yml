name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (Java 21 + Spring Boot)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable (Unix)
        if: runner.os != 'Windows'
        working-directory: java
        run: chmod +x ./mvnw

      - name: Build and test
        working-directory: java
        run: ./mvnw -B clean verify

  frontend:
    name: Frontend (Next.js 16 + React 19)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: next/package-lock.json

      - name: Install dependencies
        working-directory: next
        run: npm ci

      - name: Lint
        working-directory: next
        run: npm run lint

      - name: Type check
        working-directory: next
        run: npx tsc --noEmit

      - name: Build
        working-directory: next
        run: npm run build
